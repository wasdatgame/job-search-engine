// 정보 출처 라벨을 PC와 모바일에서 공통 사용
function renderEvidence(container, track, key) {
  const status = track.evidence[key];

  if (status === 'ai') {
    container.append(
      el('span', 'evidence-tag evidence-ai', 'AI 해석')
    );
  }

  if (status === 'unknown') {
    container.append(
      el('span', 'evidence-tag evidence-unknown', '정보 미확인')
    );
  }

  container.append(el('span', '', track[key]));

  // 비교표 안에서 전문 용어를 확인할 수 있도록 개선
  if (track === tracks.digital && key === 'metric') {
    const terms = el('details', 'inline-term');

    terms.append(
      el('summary', '', 'CTR·전환율 용어 설명'),
      el('p', '', 'CTR: 광고 노출 횟수 대비 클릭 횟수의 비율'),
      el('p', '', '전환율: 클릭 또는 방문 등 기준 행동 중 구매·문의 등 목표 행동으로 이어진 비율')
    );

    container.append(terms);
  }
}

// 원문 자료 이동 링크
function makeLink(targetId, label) {
  const a = el('a', 'link', label);

  a.href = '#' + targetId;

  a.addEventListener('click', () => {
    if (targetId.startsWith('J')) {
      setJobFilter('all');
    }
  });

  return a;
}

// PC 비교표 및 모바일 카드 생성
function drawMatrix() {
  const tbody = $('matrix-body');

  reset(tbody);

  fields.forEach(([label, key]) => {
    const tr = document.createElement('tr');
    const th = el('th', '', label);

    th.scope = 'row';
    tr.append(th);

    for (const id of ['crm', 'digital', 'product']) {
      const td = el('td', '');

      td.dataset.col = id;

      renderEvidence(td, tracks[id], key);

      tr.append(td);
    }

    tbody.append(tr);
  });

  const mobile = $('comparison-mobile');

  reset(mobile);

  for (const id of ['crm', 'digital', 'product']) {
    const box = el('article', 'mobile-role');

    box.dataset.mobileRole = id;

    box.append(
      el('h4', '', tracks[id].title),
      el('div', 'case-source', tracks[id].source)
    );

    const dl = document.createElement('dl');

    fields.forEach(([label, key]) => {
      const dt = el('dt', '', label);
      const dd = el('dd', '');

      renderEvidence(dd, tracks[id], key);

      dl.append(dt, dd);
    });

    box.append(dl);
    mobile.append(box);
  }
}

// 직무 유형 선택
function selectTrack(id, scroll = false) {
  const t = tracks[id];

  if (!t) return;

  currentTrack = id;

  document.querySelectorAll('[data-track]').forEach(b => {
    b.setAttribute(
      'aria-pressed',
      String(b.dataset.track === id)
    );
  });

  document.querySelectorAll('[data-col]').forEach(n => {
    n.classList.toggle(
      'active-col',
      n.dataset.col === id
    );
  });

  document.querySelectorAll('[data-mobile-role]').forEach(n => {
    n.classList.toggle(
      'active',
      n.dataset.mobileRole === id
    );
  });

  document.querySelectorAll('[data-interview]').forEach(n => {
    n.classList.toggle(
      'is-current',
      n.dataset.interview === id
    );
  });

  $('track-title').textContent = t.title;
  $('track-description').textContent = t.desc;
  $('track-label').textContent = t.tag;

  $('detail-job-title').textContent = t.jobTitle;
  $('detail-job').textContent = t.job;

  $('detail-interview-title').textContent = t.interviewTitle;
  $('detail-interview').textContent = t.interview;

  const jl = $('detail-job-link');

  jl.href = '#' + (t.jobId || 'jobs');

  jl.textContent = t.jobId
    ? '채용공고 사례 보기 ↗'
    : '채용공고 사례 살펴보기 ↗';

  $('detail-interview-link').href = '#' + t.interviewId;

  $('insight-intro').textContent =
    t.title + ' · 업무의 특징과 취업 준비 방향';

  $('insight-fact').textContent = t.fact;
  $('insight-voice').textContent = t.voice;
  $('insight-suggestion').textContent = t.suggestion;

  const points = $('insight-points');

  reset(points);

  t.points.forEach(x => {
    points.append(el('li', '', x));
  });

  const links = $('insight-links');

  reset(links);

  links.append(
    makeLink(t.interviewId, '현직자 원문 근거 ↗')
  );

  if (t.jobId) {
    links.append(
      makeLink(t.jobId, '채용공고 근거 ↗')
    );
  }

  if (scroll) {
    $('comparison').scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });
  }
}

// 채용공고 마감일 처리
const localDate = ymd => {
  const [y, m, d] = ymd.split('-').map(Number);

  return new Date(y, m - 1, d);
};

function deadlinePassed(node) {
  const n = new Date();

  const today = new Date(
    n.getFullYear(),
    n.getMonth(),
    n.getDate()
  );

  return today > localDate(node.dataset.deadline);
}

function setJobFilter(mode) {
  currentFilter = mode;

  let shown = 0;

  document.querySelectorAll('.job').forEach(job => {
    const match =
      mode === 'all' ||
      (mode === 'entry' && job.dataset.career === 'entry') ||
      (mode === 'notpast' && !deadlinePassed(job));

    job.hidden = !match;

    if (match) shown++;
  });

  document.querySelectorAll('[data-filter]').forEach(b => {
    b.setAttribute(
      'aria-pressed',
      String(b.dataset.filter === mode)
    );
  });

  $('job-empty').hidden = shown !== 0;
}

function refreshDeadlines() {
  let openByDate = 0;

  const jobs = document.querySelectorAll('.job');

  jobs.forEach(job => {
    const expired = deadlinePassed(job);

    const badge =
      job.querySelector('[data-deadline-badge]');

    badge.textContent = expired
      ? '접수 마감일 경과'
      : '접수 마감일 미도래';

    badge.className =
      'badge ' + (expired ? 'gray' : 'orange');

    if (!expired) openByDate++;
  });

  $('job-stat').textContent =
    jobs.length + '건 · 마감일 미도래 ' + openByDate + '건';

  $('job-active-label').textContent =
    '마감일 미도래 ' + openByDate + '건';

  setJobFilter(currentFilter);
}

// 검색은 마케팅 프로토타입 범위 안에서만 지원
function handleSearch(e) {
  e.preventDefault();

  const term = $('search-input')
    .value
    .trim()
    .toLowerCase()
    .replace(/\s+/g, '');

  const status = $('search-status');

  if (['마케팅', '마케터', 'marketing'].includes(term)) {
    status.textContent =
      '마케팅 직무의 세 가지 사례를 비교합니다.';

    $('comparison').scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });

    return;
  }

  const keywords = {
    crm: [
      'crm',
      '고객관리',
      '고객마케팅',
      'crm·고객',
      'crm마케팅',
      'crm·고객마케팅'
    ],

    digital: [
      '디지털',
      '디지털마케팅',
      '콘텐츠',
      '콘텐츠마케팅',
      '디지털·콘텐츠',
      '디지털·콘텐츠마케팅',
      '광고'
    ],

    product: [
      'pm',
      '제품기획',
      '제품마케팅',
      '제품마케팅(pm형)',
      '일정관리',
      '프로젝트관리'
    ]
  };

  for (const [id, words] of Object.entries(keywords)) {
    if (words.includes(term)) {
      status.textContent =
        tracks[id].title + ' 사례를 보여드립니다.';

      selectTrack(id, true);

      return;
    }
  }

  // 업종을 직무 유형으로 잘못 분류하지 않음
  if (['반도체', '삼성전자'].includes(term)) {
    status.textContent =
      '삼성전자 반도체 사례는 제품 마케팅(PM형)에서 확인할 수 있습니다. ' +
      '업종과 직무 유형은 서로 다릅니다.';

    return;
  }

  if (['데이터분석', '분석력'].includes(term)) {
    status.textContent =
      '데이터 분석은 여러 마케팅 업무에서 활용됩니다. ' +
      '아래 직무 유형별 사례를 비교해 보세요.';

    return;
  }

  status.textContent =
    '현재는 마케팅 직무의 세 가지 사례를 제공합니다. ' +
    '아래 비교 항목을 선택해 주세요.';
}

// 유튜브 외부 링크 검증
function safeYoutubeLink(raw) {
  try {
    const url = new URL(raw);

    if (url.protocol !== 'https:') return null;

    return ['youtube.com', 'youtu.be'].some(
      d => url.hostname === d ||
           url.hostname.endsWith('.' + d)
    )
      ? url.href
      : null;

  } catch {
    return null;
  }
}

// 기존 NCS API 표시 기능 유지
function renderNcs(result) {
  const root = $('ncs-list');

  reset(root);

  if (!result || result.status !== 'ok') {
    showMessage(
      root,
      'NCS 정보 조회 중 문제가 발생했습니다. 새로고침을 눌러 다시 확인할 수 있습니다.'
    );

    $('ncs-status').textContent = '조회 오류';
    $('ncs-stat').textContent = '조회 오류';

    return;
  }

  const rows = [];
  const seen = new Set();

  for (const r of result.items || []) {
    const signature = [
      r.title,
      r.category,
      r.competencyDefinition,
      r.dutyDefinition
    ].join('|');

    if (seen.has(signature)) continue;

    seen.add(signature);
    rows.push(r);
  }

  rows.slice(0, 5).forEach(r => {
    const card = el('article', 'api-card');

    card.append(
      el('span', 'badge green', 'NCS API'),
      el('h3', '', r.title || r.category || '직무정보 항목')
    );

    const add = (label, value) => {
      if (
        value === undefined ||
        value === null ||
        value === ''
      ) return;

      const row = el('div', 'kv');

      row.append(
        el('strong', '', label),
        el(
          'span',
          '',
          Array.isArray(value)
            ? value.join(', ')
            : value
        )
      );

      card.append(row);
    };

    add('직무분류', r.category);
    add('NCS 수준', r.levels ?? r.level);

    if (r.dutyDefinition) {
      add('직무분류 정의', r.dutyDefinition);
    }

    if (r.competencyDefinition) {
      add('능력단위 정의', r.competencyDefinition);
    }

    // 정의 유형을 명확히 구분하기 어려운 응답 처리
    if (!r.dutyDefinition && !r.competencyDefinition) {
      add('API 제공 설명(정의 유형 미확인)', r.description);
    }

    root.append(card);
  });

  if (!rows.length) {
    showMessage(root, '검색된 NCS 항목이 없습니다.');
  }

  $('ncs-status').textContent = '조회 완료';
  $('ncs-stat').textContent = rows.length + '건 조회';
}

// 기존 유튜브 직무 영상 필터링 유지
function videoScore(video) {
  const title = String(video.title || '');
  const desc = String(video.description || '');
  const combined = title + ' ' + desc;

  let s = 0;

  for (const word of [
    '현직자',
    '브이로그',
    '직무인터뷰',
    '직무 인터뷰',
    '하루일과',
    '하루 일과',
    '하는 일',
    '하는일',
    '실무',
    '담당업무'
  ]) {
    if (combined.includes(word)) s += 2;
  }

  for (const word of [
    '마케터',
    '마케팅팀',
    '마케팅 업무',
    '직무'
  ]) {
    if (combined.includes(word)) s++;
  }

  for (const word of [
    '면접',
    '자소서',
    '자기소개서',
    '합격',
    '면접팁',
    '면접 꿀팁',
    '채용 설명회'
  ]) {
    if (title.includes(word)) s -= 5;
  }

  return s;
}

function renderYoutube(result) {
  const root = $('youtube-list');

  reset(root);

  if (!result || result.status !== 'ok') {
    showMessage(
      root,
      '영상을 불러오지 못했습니다. 새로고침을 눌러 다시 확인할 수 있습니다.'
    );

    $('youtube-status').textContent = '조회 오류';
    $('youtube-stat').textContent = '조회 오류';

    return;
  }

  const videos = (result.items || [])
    .map((video, index) => ({
      ...video,
      link: safeYoutubeLink(video.url),
      score: videoScore(video),
      index
    }))
    .filter(v => v.link && v.score > 0)
    .sort((a, b) => b.score - a.score || a.index - b.index)
    .slice(0, 4);

  for (const v of videos) {
    const card = el('article', 'api-card');

    card.append(
      el('span', 'badge', '유튜브 직무 영상'),
      el('h3', '', v.title || '직무 영상'),
      el('div', 'meta', v.channel || '유튜브')
    );

    if (v.description) {
      card.append(
        el('p', '', String(v.description).slice(0, 200))
      );
    }

    const a = el('a', 'link', '영상 원문 보기 ↗');

    a.href = v.link;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';

    card.append(a);
    root.append(card);
  }

  if (!videos.length) {
    showMessage(
      root,
      '현재 검색 결과 중 업무를 직접 다루는 영상이 없습니다.'
    );
  }

  $('youtube-status').textContent = '조회 완료';
  $('youtube-stat').textContent = videos.length + '건 표시';
}

// 기존 API 연동
let loading = false;

async function loadApi() {
  if (loading) return;

  loading = true;
  $('reload-api').disabled = true;

  $('ncs-status').textContent = '조회 중';
  $('youtube-status').textContent = '조회 중';

  const ctrl = new AbortController();

  const timer = setTimeout(
    () => ctrl.abort(),
    12000
  );

  try {
    const url = new URL('/api/search', API_ROOT);

    url.searchParams.set('q', '마케팅');
    url.searchParams.set('sources', 'ncs,youtube');

    const response = await fetch(url, {
      headers: {
        Accept: 'application/json'
      },
      signal: ctrl.signal
    });

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    const data = await response.json();

    if (!data.ok) {
      throw new Error('Invalid API response');
    }

    renderNcs(data.results?.ncs);
    renderYoutube(data.results?.youtube);

  } catch (error) {
    console.error('직무한눈에 API:', error);

    renderNcs(null);
    renderYoutube(null);

  } finally {
    clearTimeout(timer);

    loading = false;
    $('reload-api').disabled = false;
  }
}
